<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HP iLO Genie</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><h1>HP iLO Genie <span id="target">Remote console</span></h1><p id="status">Connecting…</p></div><nav><button id="reconnect">Reconnect</button><button id="refresh">Refresh screen</button><button id="signin">Sign in</button></nav></header>
<main><form id="login" hidden><h2>Sign in to iLO</h2><p>Use the credentials for your iLO management interface.</p><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Open console</button><p id="error"></p></form>
<div id="screen"><canvas id="console" width="1024" height="768" tabindex="0" aria-label="Remote server screen. Click to focus keyboard and mouse."></canvas></div><p class="hint" id="hint">Click the screen to send keyboard and mouse input. Click outside it to release.</p></main>
<footer>HP iLO Genie 0.1.0 · Built with <a href="https://github.com/mildsunrise/ilo-protocol" target="_blank" rel="noreferrer">ilo-protocol</a> · <a href="/source.tar.gz">Source</a> · <a href="/license">AGPL-3.0-or-later</a> · No warranty</footer><script src="/app.js"></script></body></html>
